[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "miboe-education"
version = "0.1.0"
description = "Official MIBO Education Satellite observation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "pytest-cov>=5,<7", "respx>=0.21,<1", "ruff>=0.6,<1"]

[project.scripts]
miboe = "miboe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/miboe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "S603"]
