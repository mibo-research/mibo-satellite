name: EIBO tests
on:
  pull_request:
    paths: ["eibo/**", ".github/workflows/eibo-*.yml", "AGENTS.md"]
  push:
    branches: [main]
    paths: ["eibo/**", ".github/workflows/eibo-*.yml", "AGENTS.md"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eibo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eibo/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: eibo validate --engineering
      - run: pytest --cov=eibo --cov-report=term-missing
      - run: ruff check src tests
