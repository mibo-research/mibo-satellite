name: EIBO W0 live qualification
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Fail-closed W0 qualification stage
        required: true
        type: choice
        options: [report, preflight, smoke, providers, rehearsal]
        default: report
      series_id:
        description: Series for Q1/Q2; ALL runs each independently
        required: true
        type: choice
        options: [ALL, M01, M02, M03, M04, M05]
        default: ALL
permissions:
  contents: read
jobs:
  qualify:
    runs-on: [self-hosted, eibo-w0]
    environment: eibo-w0
    concurrency:
      group: eibo-w0-live-qualification
      cancel-in-progress: false
    defaults:
      run:
        working-directory: eibo
        shell: bash
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      EIBO_W0_EVIDENCE_ROOT: ${{ vars.EIBO_W0_EVIDENCE_ROOT }}
      EIBO_W0_PROTECTED_ENVIRONMENT: configured
      EIBO_W0_RUNNER_REQUIREMENTS: configured
      QUALIFICATION_STAGE: ${{ inputs.stage }}
      QUALIFICATION_SERIES: ${{ inputs.series_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eibo/pyproject.toml
      - run: python -m pip install -e .
      - name: Require controlled persistent evidence storage
        run: |
          if [ -z "$EIBO_W0_EVIDENCE_ROOT" ]; then
            echo "EIBO_W0_EVIDENCE_ROOT repository variable is required" >&2
            exit 1
          fi
      - name: Execute selected fail-closed stage
        run: |
          args=(--root . --output-root "$EIBO_W0_EVIDENCE_ROOT")
          if [ "$QUALIFICATION_SERIES" != "ALL" ] && \
             { [ "$QUALIFICATION_STAGE" = "smoke" ] || \
               [ "$QUALIFICATION_STAGE" = "providers" ] || \
               [ "$QUALIFICATION_STAGE" = "preflight" ] || \
               [ "$QUALIFICATION_STAGE" = "report" ]; }; then
            args+=(--series "$QUALIFICATION_SERIES")
          fi
          if [ "$QUALIFICATION_STAGE" != "report" ] && \
             [ "$QUALIFICATION_STAGE" != "preflight" ]; then
            eibo qualify preflight "${args[@]}"
          fi
          eibo qualify "$QUALIFICATION_STAGE" "${args[@]}"

# Raw qualification evidence is intentionally not uploaded as a GitHub Actions artifact.
# The protected self-hosted runner must retain EIBO_W0_EVIDENCE_ROOT in controlled storage.
