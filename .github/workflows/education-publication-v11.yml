name: Education v1.1 byte-locked publication audit
on:
  pull_request:
    paths: ["satellites/mibo-education/releases/v1.1/**", "satellites/mibo-education/protocol/registration/*v1.1*", "satellites/mibo-education/PUBLICATION-v1.1.md", ".github/workflows/education-publication-v11.yml"]
  push:
    branches: [main]
    paths: ["satellites/mibo-education/releases/v1.1/**", ".github/workflows/education-publication-v11.yml"]
permissions:
  contents: read
jobs:
  offline-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install 'httpx>=0.27,<1' 'PyYAML>=6,<7' 'pytest>=8.2,<9'
      - run: python -B satellites/mibo-education/releases/v1.1/verify_snapshot.py
