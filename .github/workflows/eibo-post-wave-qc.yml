name: EIBO post-wave QC
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Completed Wave manifest path
        required: true
        default: waves/W01/manifest.yaml
permissions:
  contents: read
jobs:
  qc-and-certificate:
    runs-on: [self-hosted, eibo-observatory]
    environment: eibo-w01
    concurrency:
      group: eibo-w01-post-wave
      cancel-in-progress: false
    defaults:
      run:
        working-directory: eibo
    env:
      EIBO_BLIND_SALT: ${{ secrets.EIBO_BLIND_SALT }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: eibo qc --manifest "${{ inputs.manifest }}"
      - run: eibo certificate --manifest "${{ inputs.manifest }}"
      - run: eibo export-blind --manifest "${{ inputs.manifest }}"
